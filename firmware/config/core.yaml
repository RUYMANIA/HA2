text_sensor:
  - id: text_request
    name: "Text Request"
    platform: template
    on_value:
      lambda: |-
        bool cap=false;
        auto value=temporary_cards::bounded(x,4000,4096,false,cap);
        text_scroll::transcript().receive(x,millis());
        text_scroll::stt().reset(millis(),0,176,0);++ui_v3::voice_revision();
        bool summary_cap=false;
        id(text_request).state=temporary_cards::bounded(x,30,120,false,summary_cap);
        if(summary_cap)id(text_request).state+="...";

  - id: text_response
    name: "Text Response"
    platform: template
    on_value:
      lambda: |-
        bool cap=false;
        auto value=temporary_cards::bounded(x,4000,4096,false,cap);
        // Playback owns its copied literal string, never a StringRef to a callback temporary.
        if(value=="...") text_scroll::playback().text=value;
        bool summary_cap=false;
        id(text_response).state=temporary_cards::bounded(x,30,120,false,summary_cap);
        if(summary_cap)id(text_response).state+="...";

  - platform: template
    id: voice_assistant_phase_sensor
    name: "Voice Assistant Phase ID"
    update_interval: never

  - platform: homeassistant
    id: ha_weather_temperature_unit
    entity_id: ${weather_entity}
    attribute: temperature_unit
    internal: true

  - platform: homeassistant
    id: ha_weather_wind_speed_unit
    entity_id: ${weather_entity}
    attribute: wind_speed_unit
    internal: true

