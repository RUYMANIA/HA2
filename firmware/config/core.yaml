  - id: set_phase
    parameters:
      phase: int
    then:
      - lambda: |-
          id(voice_assistant_phase) = phase;
          if(phase==2 || phase==3 || phase==4 || phase==5 || phase==6 || phase==20) {
            ui_v3::power().wake(millis(),"voice");id(ui_power_sync).execute();
          }
          if (phase==2 || phase==3 || phase==4 || phase==11 || phase==20) {
            if(phase==11 || phase==20) {text_scroll::playback().stop(millis());text_scroll::playback().attributable=false;text_scroll::timing().next_generation();}
            temporary_cards::state().interrupt(phase==11?"error":(phase==20?"timer":"new_question"));
            id(card_publish).execute();
            id(menu_close_local).execute();
          }
      - text_sensor.template.publish:
          id: voice_assistant_phase_sensor
          state: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d", phase);
            return std::string(buf);
      - homeassistant.event:
          event: esphome.phase_id
          data:
            node: ${name}
            phase: !lambda return phase;

