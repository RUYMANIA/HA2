esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - script.execute: draw_display
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display

ota:
  - platform: esphome
    id: ota_esphome

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: "RZ7D3EzJdPM6"
  on_connect:
    - component.update: clock_background
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

captive_portal:

http_request:

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        then:
          - if:
              condition:
                lambda: return id(show_clock) && !id(clock_show_seconds).state;
              then:
                - script.execute: refresh_live_display

api:
  on_client_connected:
    - lambda: |-
        const bool ha=client_info.rfind("Home Assistant",0)==0;
        if(ha) ++id(system_menu_ha_clients);
        ha2::startup().connect(ha,millis());
    - script.execute: draw_display
  on_client_disconnected:
    - lambda: |-
        if (client_info.rfind("Home Assistant",0)==0 && id(system_menu_ha_clients)>0) --id(system_menu_ha_clients);
    - script.execute: draw_display

  actions:
    - action: show_fullscreen_image
      variables:
        url: string
      then:
        - if:
            condition:
              lambda: |-
                return id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                    || id(voice_assistant_phase) == ${voice_assist_replying_phase_id};
            then:
              - lambda: id(showing_fullscreen_image) = true;
              - online_image.set_url:
                  id: temp_fullscreen
                  url: !lambda 'return url;'
                  update: true
              - delay: 600ms
              - lambda: |-
                  // Recheck after the asynchronous image delay: never steal the menu.
                  if (!system_menu::state().active && !temporary_cards::state().visible() &&
                      (id(voice_assistant_phase)==${voice_assist_idle_phase_id} ||
                       id(voice_assistant_phase)==${voice_assist_replying_phase_id})) {
                    id(main_display).show_page(empty_clock);
                  }
              - script.execute: refresh_live_display
              - script.execute: reset_screensaver
              - delay: !lambda |-
                  int s = (int) id(api_image_duration_seconds).state;
                  if (s <= 0) s = 30;
                  return (uint32_t)(s * 1000);
              - online_image.release: temp_fullscreen
              - lambda: id(showing_fullscreen_image) = false;
              - script.execute: draw_display
            else:
              - logger.log:
                  level: INFO
                  format: "show_fullscreen_image ignored (phase=%d)"
                  args: [ 'id(voice_assistant_phase)' ]

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

  - platform: template
    name: "Virtual Touch"
    id: virtual_touch
    on_press:
      - script.execute: handle_screen_tap

number:
  - platform: template
    id: clock_delay_seconds
    name: "Clock Screensaver Delay"
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 10

  - platform: template
    id: api_image_duration_seconds
    name: "API Image Display Time"
    unit_of_measurement: "s"
    icon: "mdi:timer-sand"
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 30

sensor:
  # Hardware pack provides the ADC that publishes into this template
  - platform: template
    id: battery_percentage
    name: "Battery Percentage"
    update_interval: never
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:battery-medium
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 2.80 -> 0.0
            - 3.10 -> 10.0
            - 3.30 -> 20.0
            - 3.45 -> 30.0
            - 3.60 -> 40.0
            - 3.70 -> 50.0
            - 3.75 -> 60.0
            - 3.80 -> 70.0
            - 3.90 -> 80.0
            - 4.00 -> 90.0
            - 4.20 -> 100.0
      - lambda: |-
          if (x > 100) return 100;
          if (x < 0) return 0;
          return x;
    on_value:
      then:
        - lambda: |-
            int current = (int) x;
            if (current == id(last_battery_percent)) return;
            id(last_battery_percent) = current;
        - if:
            condition:
              switch.is_on: show_battery_status
            then:
              - script.execute: refresh_live_display

  - platform: homeassistant
    id: ha_weather_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
  - platform: homeassistant
    id: ha_weather_wind_speed
    entity_id: ${weather_entity}
    attribute: wind_speed
    internal: true
binary_sensor:
  - platform: template
    name: "Touch Button"
    id: touch_input
    on_click:
      min_length: 30ms
      max_length: 600ms
      then:
        - if:
            condition:
              lambda: |-
                if (temporary_cards::state().visible()) {
                  temporary_cards::state().cancel(temporary_cards::state().active.id);
                  id(card_publish).execute(); id(draw_display).execute(); return false;
                }
                return !system_menu::state().active;
            then:
              - if:
                  condition:
                    switch.is_on: timer_ringing
                  then:
                    - switch.turn_off: timer_ringing
                  else:
                    - if:
                        condition:
                          lambda: return id(wake_word_engine_location).current_option() == "On device";
                        then:
                          - media_player.stop:
                              id: external_media_player
                          - if:
                              condition:
                                not:
                                  voice_assistant.is_running:
                              then:
                                - voice_assistant.start:
                              else:
                                - voice_assistant.stop:

  - platform: gpio
    pin:
      number: 0
      mode: INPUT_PULLUP
#      ignore_strapping_warning: true
      inverted: true
    id: left_button
    on_multi_click:
      - timing:
          - ON for 40ms to 400ms
          - OFF for at least 330ms
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      lambda: return id(wake_word_engine_location).current_option() == "On device";
                    then:
                      - media_player.stop:
                          id: external_media_player
                      - if:
                          condition:
                            not:
                              voice_assistant.is_running:
                          then:
                            - voice_assistant.start:
                          else:
                            - voice_assistant.stop:
      - timing:
          - ON for at least 1s
        then:
          - switch.toggle: show_battery_status
          - script.execute: refresh_live_display

  - platform: template
    name: "Timer Ringing Active"
    id: timer_ringing_active
    device_class: sound
    lambda: |-
      return id(timer_ringing).state;

  - platform: template
    id: swipe_left
    name: "Swipe Left"
    device_class: moving
    entity_category: diagnostic

  - platform: template
    id: swipe_right
    name: "Swipe Right"
    device_class: moving
    entity_category: diagnostic
    
  - platform: template
    id: swipe_up
    name: "Swipe Up"
    device_class: moving
    entity_category: diagnostic
    
  - platform: template
    id: swipe_down
    name: "Swipe Down"
    device_class: moving
    entity_category: diagnostic
    
output:
  # colors for the clock (logical; not the screen backlight)
  - platform: template
    id: clock_color_r
    type: float
    write_action:
      - lambda: |-
          return;

  - platform: template
    id: clock_color_g
    type: float
    write_action:
      - lambda: |-
          return;

  - platform: template
    id: clock_color_b
    type: float
    write_action:
      - lambda: |-
          return;

light:
  - platform: rgb
    id: clock_color_picker
    name: "Clock Color"
    entity_category: config
    red: clock_color_r
    green: clock_color_g
    blue: clock_color_b

micro_wake_word:
  id: !extend mww
  on_wake_word_detected:
    - lambda: temporary_cards::state().interrupt("new_question");
    - script.execute: card_publish
    - script.execute: reset_screensaver
    - if:
        condition:
          switch.is_on: wake_sound
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(wake_word_triggered_sound);
          - delay: 300ms
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: external_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  on_listening:
    - lambda: |-
        temporary_cards::state().interrupt("new_question");
        text_scroll::timing().next_generation();
        text_scroll::transcript().new_turn();text_scroll::stt().reset(millis(),0,176,0);++ui_v3::voice_revision();
        text_scroll::playback()=text_scroll::Playback{};
        ui_v3::power().wake(millis(),"voice");id(ui_power_sync).execute();
    - script.execute: card_publish
    - script.execute: reset_screensaver
    - script.execute:
        id: set_phase
        phase: ${voice_assist_waiting_for_command_phase_id}
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: draw_display

  on_stt_vad_start:
    - script.execute:
        id: set_phase
        phase: ${voice_assist_listening_phase_id}

  on_stt_vad_end:
    - script.execute:
        id: set_phase
        phase: ${voice_assist_thinking_phase_id}
    - script.execute: draw_display

  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display


  on_tts_start:
    - lambda: |-
        if (temporary_cards::state().tts_start(x,millis())) {
          const auto &body=temporary_cards::state().active.text;
          text_scroll::playback().begin(body,millis(),text_scroll::frames().load(std::memory_order_relaxed),!id(box_speaker).is_running());
          text_scroll::apply_pending(text_scroll::playback(),text_scroll::timing(),millis());++ui_v3::voice_revision();
          ui_v3::power().wake(millis(),"tts");id(ui_power_sync).execute();
          id(playing_internal_sound)=true;
          id(set_phase).execute(${voice_assist_replying_phase_id});
          id(reset_screensaver).execute();
          id(draw_display).execute();
          id(card_publish).execute();
          return;
        }
        // Ignore reserved stale markers; never attribute them to a new generation.
        if (temporary_cards::is_marker(x)) return;
        temporary_cards::state().interrupt("foreign_tts");
        bool capped=false;
        const auto display_text=temporary_cards::bounded(x,4000,4096,false,capped);
        const auto duration=text_scroll::timing().take(x,millis());
        auto &pb=text_scroll::playback();
        pb.begin(x,millis(),text_scroll::frames().load(std::memory_order_relaxed),!id(box_speaker).is_running());
        if(duration)pb.metadata(x,duration,millis());
        text_scroll::apply_pending(pb,text_scroll::timing(),millis());++ui_v3::voice_revision();
        ui_v3::power().wake(millis(),"tts");id(ui_power_sync).execute();
        id(card_publish).execute();
        // Unmodified normal speech route, including inherited TTS/Assist events.
        id(send_tts_text_event).execute(x);
        id(reset_screensaver).execute();
        id(text_response).publish_state(x);
        id(set_phase).execute(${voice_assist_replying_phase_id});
        id(playing_internal_sound)=true;
        id(draw_display).execute();

  on_tts_end:
    - lambda: |-
        auto &c=temporary_cards::state();
        text_scroll::playback().uri(x,!id(box_speaker).is_running());
        if (temporary_cards::state().tts_end(x,c.owner_generation)) {
          id(card_publish).execute(); return;
        }
        id(send_tts_uri_event).execute(x);

  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s

    - wait_until:
        condition:
          - and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
                    id: box_speaker

    - if:
        condition:
          lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
          - script.execute: set_idle_or_mute_phase
          - script.execute: draw_display
        else:
          - if:
              condition:
                lambda: |-
                  return id(voice_assistant_phase) == ${voice_assist_replying_phase_id}
                      || id(voice_assistant_phase) == ${voice_assist_thinking_phase_id};
              then:
                - script.execute: set_idle_or_mute_phase
                - script.execute: draw_display

  on_error:
    - if:
        condition:
          lambda: return !id(init_in_progress);
        then:
          - script.execute:
              id: set_phase
              phase: ${voice_assist_error_phase_id}
          - script.execute: draw_display
          - delay: 1s
          - if:
              condition:
                switch.is_off: mute
              then:
                - script.execute:
                    id: set_phase
                    phase: ${voice_assist_idle_phase_id}
              else:
                - script.execute:
                    id: set_phase
                    phase: ${voice_assist_muted_phase_id}
                - script.execute: draw_display

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display

  on_client_disconnected:
    - script.execute: stop_wake_word
    - script.execute:
        id: set_phase
        phase: ${voice_assist_not_ready_phase_id}
    - script.execute: draw_display

  on_timer_started:
    - lambda: ui_v3::power().wake(millis(),"timer");id(ui_power_sync).execute();
    - script.execute: menu_close_local
    - script.execute: reset_screensaver
    - script.execute: draw_display

  on_timer_cancelled:
    - script.execute: refresh_live_display

  on_timer_updated:
    - script.execute: refresh_live_display

  on_timer_tick:
    - script.execute: refresh_live_display

  on_timer_finished:
    - switch.turn_on: timer_ringing
    - wait_until:
        condition:
          - media_player.is_announcing:
    - script.execute:
        id: set_phase
        phase: ${voice_assist_timer_finished_phase_id}
    - script.execute: draw_display

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (system_menu::state().active || temporary_cards::state().visible()) { id(idle_seconds)=0; return; }
          const bool idle_phase   = (id(voice_assistant_phase) == ${voice_assist_idle_phase_id});
          const bool not_muted    = !id(mute).state;
          const bool clock_ok     = id(clock_enabled).state;
          const bool not_fullscreen   = !id(showing_fullscreen_image);

          id(check_if_timers_active).execute();
          const bool has_active_timer = id(global_is_timer_active);

          if (!id(init_in_progress) && idle_phase && not_muted && clock_ok && not_fullscreen && !has_active_timer) {
            id(idle_seconds)++;
            int delay_s = (int) id(clock_delay_seconds).state;
            if (delay_s <= 0) delay_s = 30;
            if (id(idle_seconds) >= delay_s && !id(show_clock)) {
              id(show_clock) = true;
              id(show_clock_page).execute();
            }
          } else {
            if (id(show_clock)) id(show_clock) = false;
            id(idle_seconds) = 0;
          }
      - if:
          condition:
            lambda: return id(show_clock) && id(clock_show_seconds).state;
          then:
            - script.execute: refresh_live_display

  - interval: 5s
    then:
      - if:
          condition:
            lambda: return id(show_clock) && !id(clock_show_seconds).state;
          then:
           - script.execute: refresh_live_display

script:
  - id: draw_display
    then:
      - script.execute: card_tick
      - if:
          condition:
            lambda: return temporary_cards::state().visible() && !system_menu::state().active;
          then:
            - script.execute: card_render
      - if:
          condition:
            lambda: return !system_menu::state().active && !temporary_cards::state().visible();
          then:
            - lambda: id(avatar_preview_state) = -1;
            - if:
                condition:
                  lambda: return !id(init_in_progress);
                then:
                  - if:
                      condition:
                        wifi.connected:
                      then:
                        - if:
                            condition:
                              api.connected:
                            then:
                              - lambda: |-
                                  if (id(showing_fullscreen_image)
                                      && id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
                                    id(main_display).show_page(empty_clock);
                                    if (id(main_display).is_ready() && ui_v3::power().awake) id(main_display).update();
                                    return;
                                  }
                                  if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                                      && id(show_clock)
                                      && id(clock_enabled).state) {
                                    id(show_clock_page).execute();
                                    return;
                                  }
                                  switch(id(voice_assistant_phase)) {
                                    case ${voice_assist_waiting_for_command_phase_id}:
                                    case ${voice_assist_listening_phase_id}:
                                      id(main_display).show_page(listening_page);
                                      break;
                                    case ${voice_assist_thinking_phase_id}:
                                      id(main_display).show_page(thinking_page);
                                      break;
                                    case ${voice_assist_replying_phase_id}:
                                      id(main_display).show_page(replying_page);
                                      break;
                                    case ${voice_assist_error_phase_id}:
                                      id(main_display).show_page(error_page);
                                      break;
                                    case ${voice_assist_muted_phase_id}:
                                      id(main_display).show_page(muted_page);
                                      break;
                                    case ${voice_assist_not_ready_phase_id}:
                                      id(main_display).show_page(no_ha_page);
                                      break;
                                    case ${voice_assist_timer_finished_phase_id}:
                                      id(main_display).show_page(timer_finished_page);
                                      break;
                                    case ${voice_assist_playing_phase_id}:
                                      id(main_display).show_page(now_playing_page);
                                      break;
                                    default:
                                      id(main_display).show_page(idle_page);
                                      break;
                                  }
                                  if (id(main_display).is_ready() && ui_v3::power().awake) id(main_display).update();
                            else:
                              - display.page.show: no_ha_page
                              - script.execute: refresh_live_display
                      else:
                        - display.page.show: no_wifi_page
                        - script.execute: refresh_live_display
                else:
                  - display.page.show: initializing_page
                  - script.execute: refresh_live_display

  - id: fetch_first_active_timer
    then:
      - lambda: |-
          const auto &timers = id(va).get_timers();
          if (timers.empty()) return;

          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(global_first_active_timer) = output_timer;

  - id: check_if_timers_active
    then:
      - lambda: |-
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
              break;
            }
          }
          id(global_is_timer_active) = output;

  - id: fetch_first_timer
    then:
      - lambda: |-
          const auto &timers = id(va).get_timers();
          if (timers.empty()) return;

          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(global_first_timer) = output_timer;

  - id: check_if_timers
    then:
      - lambda: |-
          const auto &timers = id(va).get_timers();
          id(global_is_timer) = !timers.empty();

  - id: draw_timer_timeline
    then:
      - lambda: |-
          const int W = id(main_display).get_width();
          const int H = id(main_display).get_height();
          const bool SMALL = (W <= 128 && H <= 64);

          // refresh timer state
          id(check_if_timers_active).execute();
          id(check_if_timers).execute();
          if (!id(global_is_timer_active) && !id(global_is_timer)) return;

          if (SMALL) {
            // ---------- compact UI for tiny screens (monochrome safe) ----------
            const int pad    = 6;
            const int bar_h  = 6;
            const int bar_w  = W - (pad * 2);
            const int x      = pad;
            const int y      = H - bar_h - pad;

            uint32_t total = 0, left = 0;
            if (id(global_is_timer_active)) {
              id(fetch_first_active_timer).execute();
              total = std::max(id(global_first_active_timer).total_seconds, (uint32_t)1);
              left  = id(global_first_active_timer).seconds_left;
            } else {
              id(fetch_first_timer).execute();
              total = std::max(id(global_first_timer).total_seconds, (uint32_t)1);
              left  = id(global_first_timer).seconds_left;
            }

            // label "m:ss" if >=60s, else "ss"
            char label[16];
            if (left >= 60) {
              unsigned long mm = left / 60;
              unsigned long ss = left % 60;
              snprintf(label, sizeof(label), "%lu:%02lu", mm, ss);
            } else {
              snprintf(label, sizeof(label), "%lus", (unsigned long) left);
            }

            // centered box (clear interior first)
            const int box_w = 78;
            const int box_h = 26;
            const int box_x = (W - box_w) / 2;
            const int box_y = (H - box_h) / 2 - 2;

            id(main_display).filled_rectangle(box_x + 1, box_y + 1, box_w - 2, box_h - 2, Color::BLACK);
            id(main_display).rectangle(box_x, box_y, box_w, box_h, Color::WHITE);
            id(main_display).printf(W/2, box_y + box_h/2, id(font_big_date), Color::WHITE,
                                    TextAlign::CENTER, "%s", label);

            // progress bar (outline, clear interior, then fill progress)
            id(main_display).rectangle(x, y, bar_w, bar_h, Color::WHITE);
            const int in_w = bar_w - 2;
            const int in_h = bar_h - 2;
            id(main_display).filled_rectangle(x + 1, y + 1, in_w, in_h, Color::BLACK);

            int filled_px = (int) lroundf(in_w * (float) left / (float) total);
            if (filled_px > 0) {
              id(main_display).filled_rectangle(x + 1, y + 1, filled_px, in_h, Color::WHITE);
            }
            return;  // small-screen path done
          }

          // ---------- original timeline for larger panels (unchanged) ----------
          const int padding = 20;
          const int bar_h   = 15;
          const int bar_w   = W - (padding * 2);
          const int x       = (W - bar_w) / 2;
          const int y       = H - (bar_h + 15);
          const int fill_h  = bar_h - 2;

          if (id(global_is_timer_active)) {
            id(fetch_first_active_timer).execute();
            int filled = round(
              bar_w * id(global_first_active_timer).seconds_left
              / std::max(id(global_first_active_timer).total_seconds, (uint32_t)1)
            );
            id(main_display).filled_rectangle(x, y, bar_w, bar_h, Color::WHITE);
            if (filled > 0) {
              id(main_display).filled_rectangle(x, y + 1, filled, fill_h, id(active_timer_color));
            }
          } else if (id(global_is_timer)) {
            id(fetch_first_timer).execute();
            int filled = round(
              bar_w * id(global_first_timer).seconds_left
              / std::max(id(global_first_timer).total_seconds, (uint32_t)1)
            );
            id(main_display).filled_rectangle(x, y, bar_w, bar_h, Color::WHITE);
            if (filled > 0) {
              id(main_display).filled_rectangle(x, y + 1, filled, fill_h, id(paused_timer_color));
            }
          }

  - id: draw_active_timer_widget
    then:
      - lambda: |-
          // Skip the circular widget on tiny screens; keep for larger panels
          const int W = id(main_display).get_width();
          const int H = id(main_display).get_height();
          if (W <= 128 && H <= 64) return;

          id(check_if_timers_active).execute();
          if (!id(global_is_timer_active)) return;

          // --- original circular widget (unchanged) ---
          const int cx = W / 2;
          const int cy = H / 2;

          const int S = std::min(W, H);
          const int R_SEC = (int)(S * 0.30f);
          const int L_SEC = std::max(5, S / 28);
          const int TH_SEC = 2;

          const int GAP   = std::max(6, S / 60);
          const int R_MIN = R_SEC - L_SEC - GAP;
          const int L_MIN = std::max(4, L_SEC - 3);
          const int TH_MIN = 2;

          const Color GREY(60, 60, 60);
          const Color SEC_COL = id(paused_timer_color); // blue
          const Color MIN_COL(255, 64, 64);             // red

          id(fetch_first_active_timer).execute();
          uint32_t left  = id(global_first_active_timer).seconds_left;
          int hours_left   = left / 3600;
          int minutes_left = (left / 60) % 60;
          int seconds_left = left % 60;

          int sec_active = seconds_left;
          if ((minutes_left + hours_left) > 0 && seconds_left == 0) sec_active = 60;

          int min_active = minutes_left;
          if (hours_left > 0 && minutes_left == 0) min_active = 60;

          auto draw_tick = [&](float angle, int r_end, int len, Color col, int thick) {
            const float ca = cosf(angle), sa = sinf(angle);
            const int x1 = cx + (int)((r_end - len) * ca);
            const int y1 = cy + (int)((r_end - len) * sa);
            const int x2 = cx + (int)(r_end * ca);
            const int y2 = cy + (int)(r_end * sa);

            if (thick <= 1) {
              id(main_display).line(x1, y1, x2, y2, col);
              return;
            }
            const float px = -sa, py = ca;
            for (int t = -thick/2; t <= thick/2; ++t) {
              int ox = (int) lroundf(px * t);
              int oy = (int) lroundf(py * t);
              id(main_display).line(x1 + ox, y1 + oy, x2 + ox, y2 + oy, col);
            }
          };

          const float TWO_PI = 6.2831853f;
          for (int i = 0; i < 60; ++i) {
            float a = -3.1415926f/2 + (i / 60.0f) * TWO_PI;
            draw_tick(a, R_SEC, L_SEC, (i < sec_active) ? SEC_COL : GREY, TH_SEC);
          }

          if (left >= 60) {
            for (int i = 0; i < 60; ++i) {
              float a = -3.1415926f/2 + (i / 60.0f) * TWO_PI;
              draw_tick(a, R_MIN, L_MIN, (i < min_active) ? MIN_COL : GREY, TH_MIN);
            }
          }

          char s_buf[8];
          snprintf(s_buf, sizeof(s_buf), "%02d", seconds_left);
          id(main_display).printf(cx, cy + 2, id(font_big_clock_mono), Color::WHITE,
                                  TextAlign::CENTER, "%s", s_buf);

          if (left >= 60) {
            int total_minutes = left / 60;
            char m_buf[12];
            snprintf(m_buf, sizeof(m_buf), "%d", total_minutes);
            const int TEXT_PAD = std::max(16, S / 14);
            int y_min = cy - (L_SEC + TEXT_PAD);
            id(main_display).printf(cx, y_min, id(font_big_clock_mono), Color::WHITE,
                                    TextAlign::CENTER, "%s", m_buf);
          }

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
#              - not:
#                  speaker.is_playing:
#                    id: box_speaker
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
