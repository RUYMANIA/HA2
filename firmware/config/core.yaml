    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - script.execute:
                id: set_phase
                phase: ${voice_assist_idle_phase_id}
          else:
            - script.execute:
                id: set_phase
                phase: ${voice_assist_muted_phase_id}

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "std::add_const_t<audio::AudioFile>*"
    then:
      - lambda: |-
          id(playing_internal_sound) = true;
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)->play_file(const_cast<audio::AudioFile*>(sound_file), true, false);
          }

  - id: reset_screensaver
    then:
      - lambda: |-
          id(show_clock) = false;
          id(idle_seconds) = 0;

  - id: handle_screen_tap
    then:
      - if:
          condition:
            lambda: return system_menu::state().active || temporary_cards::state().visible();
          then:
            - lambda: |-
                if(system_menu::state().active) id(menu_close_local).execute();
                else {
                  temporary_cards::state().cancel(temporary_cards::state().active.id);
                  id(card_publish).execute(); id(draw_display).execute();
                }
          else:
            - script.execute: reset_screensaver
            - if:
                condition:
                  switch.is_on: timer_ringing
                then:
                  - switch.turn_off: timer_ringing
                else:
                  - if:
                      condition:
                        lambda: return id(wake_word_engine_location).current_option() == "On device";
                      then:
                        - if:
                            condition:
                              not:
                                voice_assistant.is_running:
                            then:
                              - voice_assistant.start:
                            else:
                              - voice_assistant.stop:
            - display.page.show: idle_page
            - script.execute: refresh_live_display


