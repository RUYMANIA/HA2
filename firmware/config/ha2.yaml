# HA² branding and night configuration. Selects/switch own preferences; RAM is derived.
esphome:
  comment: "HA² 1.3.2 — local Spanish Okey Hermes candidate; existing UI and audio preserved"
  includes:
    - ui_catalogue.h
    - night_mode.h
    - ha2_cue.h
    - ha2_startup.h
  project:
    name: ruymania.ha2
    version: 1.3.2
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            ui_v3::clock_reader()=[]()->ui_v3::LocalClock {
              const auto c=id(homeassistant_time).now();
              return {c.is_valid(),int(c.hour)*60+int(c.minute)};
            };
image:
  - platform: file
    file: assets/ha2/qr-140-opaque-rgb.png
    id: ha2_project_qr
    type: GRAYSCALE
    transparency: opaque
font:
  - id: !extend font_request_response
    glyphs: ['á', 'é', 'í', 'ó', 'ú', 'ñ']
  - id: !extend font_battery
    glyphs: ['²', 'á', 'é', 'í', 'ó', 'ú', 'ñ']
  - id: !extend font_big_date
    glyphs: ['²', 'á', 'é', 'í', 'ó', 'ú', 'ñ']
  - file:
      type: gfonts
      family: ${font_family}
      weight: 400
    id: font_project_small
    size: 10
    glyphsets:
      - ${font_glyphsets}
select:
  - platform: template
    id: ui_language
    name: Language
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: English
    options: ['English', 'Español']
    on_value:
      - lambda: |-
          // The select is the single persisted authority; no mirror preference.
          if(system_menu::state().active) id(menu_render).execute();
          else if(temporary_cards::state().visible() && id(main_display).is_ready() && ui_v3::power().awake) {
            id(main_display).show_page(id(temporary_card_page));if(id(main_display).is_ready() && ui_v3::power().awake) id(main_display).update();
          }
  - platform: template
    id: screen_night_start
    name: Modo noche Inicio
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: '23:00'
    options: &night_slots ['00:00', '00:15', '00:30', '00:45', '01:00', '01:15', '01:30', '01:45', '02:00', '02:15', '02:30', '02:45', '03:00', '03:15', '03:30', '03:45', '04:00', '04:15', '04:30', '04:45', '05:00', '05:15', '05:30', '05:45', '06:00', '06:15', '06:30', '06:45', '07:00', '07:15', '07:30', '07:45', '08:00', '08:15', '08:30', '08:45', '09:00', '09:15', '09:30', '09:45', '10:00', '10:15', '10:30', '10:45', '11:00', '11:15', '11:30', '11:45', '12:00', '12:15', '12:30', '12:45', '13:00', '13:15', '13:30', '13:45', '14:00', '14:15', '14:30', '14:45', '15:00', '15:15', '15:30', '15:45', '16:00', '16:15', '16:30', '16:45', '17:00', '17:15', '17:30', '17:45', '18:00', '18:15', '18:30', '18:45', '19:00', '19:15', '19:30', '19:45', '20:00', '20:15', '20:30', '20:45', '21:00', '21:15', '21:30', '21:45', '22:00', '22:15', '22:30', '22:45', '23:00', '23:15', '23:30', '23:45']
    on_value:
      - lambda: |-
          auto &p=ui_v3::power();
          const auto next=id(screen_night_start).active_index().value_or(92);
          if(p.night.start!=next){p.night.start=next;++p.persist_changes;}
          if(ui_v3::night_edit())p.wake(millis(),"touch");
          id(ui_power_sync).execute();
          if(system_menu::state().active)id(menu_render).execute();
  - platform: template
    id: screen_night_end
    name: Modo noche Fin
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: '07:00'
    options: *night_slots
    on_value:
      - lambda: |-
          auto &p=ui_v3::power();
          const auto next=id(screen_night_end).active_index().value_or(28);
          if(p.night.end!=next){p.night.end=next;++p.persist_changes;}
          if(ui_v3::night_edit())p.wake(millis(),"touch");
          id(ui_power_sync).execute();
          if(system_menu::state().active)id(menu_render).execute();
switch:
  - platform: template
    id: screen_night_enabled
    name: Modo noche
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          auto &p=ui_v3::power();if(!p.night.enabled){p.night.enabled=true;++p.persist_changes;}
          if(ui_v3::night_edit())p.wake(millis(),"touch");
          id(ui_power_sync).execute();
          if(system_menu::state().active)id(menu_render).execute();
    turn_off_action:
      - lambda: |-
          auto &p=ui_v3::power();if(p.night.enabled){p.night.enabled=false;++p.persist_changes;}
          if(ui_v3::night_edit())p.wake(millis(),"touch");
          id(ui_power_sync).execute();
          if(system_menu::state().active)id(menu_render).execute();
text_sensor:
  - platform: template
    id: ui_startup
    name: UI Startup
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: ui_night
    name: UI Night
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: ui_cue
    name: UI Cue
    entity_category: diagnostic
    update_interval: never

media_player:
  - id: !extend external_media_player
    files:
      - id: ha2_notification_sound
        file: assets/ha2/notification.wav

script:
  - id: ha2_card_cue
    then:
      - lambda: |-
          auto &p=ui_v3::power();p.refresh_night(millis());
          auto &c=temporary_cards::state();
          const auto clock=id(homeassistant_time).now();
          const int minute=int(clock.hour)*60+int(clock.minute);
          const bool night_guard=p.night_active || (clock.second>=58 && p.night.contains(clock.is_valid(),(minute+1)%1440));
          const int phase=id(voice_assistant_phase);
          const bool safe=!id(init_in_progress) && !id(timer_ringing).state && !id(va).is_running() && !id(box_speaker).is_running() && !c.owns_audio() && !system_menu::state().active && (phase==1 || phase==12) && id(external_media_player).state==media_player::MEDIA_PLAYER_STATE_IDLE;
          if(ha2::cue().enter(c.active.generation,c.visible(),safe,night_guard,millis())){
            text_scroll::playback().stop(millis());
            id(playing_internal_sound)=true;
            // Ownership is installed above, BEFORE the public file call can emit a callback.
            id(external_media_player).play_file(id(ha2_notification_sound),true,false);
          }
  - id: ha2_startup_tick
    then:
      - lambda: |-
          const auto clock=id(homeassistant_time).now();
          auto &p=ui_v3::power();p.refresh_night(millis());
          const int minute=int(clock.hour)*60+int(clock.minute);
          const bool night=p.night_active || (clock.second>=54 && p.night.contains(clock.is_valid(),(minute+1)%1440));
          const int phase=id(voice_assistant_phase);
          const bool safe=!id(init_in_progress) && !id(timer_ringing).state && !id(va).is_running() && !id(box_speaker).is_running() && !temporary_cards::state().owns_audio() && !temporary_cards::state().exists() && !ha2::cue().owner && (phase==1 || phase==12) && id(external_media_player).state==media_player::MEDIA_PLAYER_STATE_IDLE;
          if(ha2::startup().tick(millis(),id(system_menu_ha_clients)>0,clock.is_valid(),night,id(startup_sound_switch).state,safe,text_scroll::frames().load(std::memory_order_relaxed))) {
            // Admission installed before playback. No priority STOP; existing announcement/idle
            // callbacks pause and restore wake only when a sound is actually played.
            id(play_sound)->execute(false,id(ready_sound));
          }
interval:
  - interval: 100ms
    then:
      - script.execute: ha2_startup_tick

