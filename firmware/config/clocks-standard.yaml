select:
  - platform: template
    entity_category: config
    name: "Clock Style"
    id: clock_style
    icon: "mdi:clock-digital"
    optimistic: true
    restore_value: true
    options:
      - 7-segment
      - Default
      - Analog
      - Xiaozhi
    initial_option: Default
    on_value:
      - if:
          condition:
            lambda: return id(show_clock);
          then:
            - script.execute: show_clock_page
  - platform: template
    entity_category: config
    name: "Clock Wallpaper (Online)"
    id: clock_wallpaper_image
    icon: "mdi:image"
    optimistic: true
    restore_value: true
    options:
      - clock
      - redmarble
      - starrysky
      - tron
      - chip
    initial_option: ${clock_background_image}
    on_value:
      - online_image.set_url:
          id: clock_background
          url: !lambda |-
            std::string base = "${imagepath}/Other/"
                               "${screenwidth}x${screenheight}/";
            return base + std::string(x) + ".png";
          update: true
      - script.execute: refresh_live_display
script:
  - id: show_clock_page
    then:
      - lambda: |-
          if (system_menu::state().active || temporary_cards::state().visible()) return;
          const std::string sel = id(clock_style).current_option();
          if (sel == "Default") {
            id(main_display).show_page(default_clock);
          } else if (sel == "Analog") {
            id(main_display).show_page(analog_clock);
          } else if (sel == "Xiaozhi") {
            id(main_display).show_page(xiaozhi_clock);
          } else {
            id(main_display).show_page(clock_7segment);
          }
          if (id(main_display).is_ready() && ui_v3::power().awake) id(main_display).update();
  - id: swipe_left_action
    then:
      - lambda: |-
          static const char* const opts[] = {"7-segment","Default","Analog","Xiaozhi"};
          const int N = sizeof(opts)/sizeof(opts[0]);
          std::string cur = id(clock_style).current_option();
          int idx = 0;
          for (int i = 0; i < N; i++) if (cur == opts[i]) { idx = i; break; }
          id(clock_style).publish_state(opts[(idx + 1) % N]);
  - id: swipe_right_action
    then:
      - lambda: |-
          static const char* const opts[] = {"7-segment","Default","Analog","Xiaozhi"};
          const int N = sizeof(opts)/sizeof(opts[0]);
          std::string cur = id(clock_style).current_option();
          int idx = 0;
          for (int i = 0; i < N; i++) if (cur == opts[i]) { idx = i; break; }
          id(clock_style).publish_state(opts[(idx - 1 + N) % N]);
  - id: swipe_up_action
    then:
      - lambda: |-
          static const char* const opts[] = {"clock","redmarble","starrysky","tron","chip"};
          const int N = sizeof(opts)/sizeof(opts[0]);
          std::string cur = id(clock_wallpaper_image).current_option();
          int idx = 0;
          for (int i = 0; i < N; i++) if (cur == opts[i]) { idx = i; break; }
          id(clock_wallpaper_image).publish_state(opts[(idx + 1) % N]);
  - id: swipe_down_action
    then:
      - switch.toggle: show_battery_status
      - script.execute: refresh_live_display
